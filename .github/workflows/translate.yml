name: Auto Translate

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**/*.md'

concurrency:
  group: translation-queue
  cancel-in-progress: false

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run translation script
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python translate.py

      # 🌟 核心修复：在提交前，先自动拉取合并您在此期间推送的新 Commit（如第二套代码），绝不浪费翻译成果！
      - name: Pull latest remote changes
        run: |
          git pull --rebase origin main || true

      - name: Commit and push translated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto translate markdown files via DeepSeek"
          file_pattern: 'docs/**'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'