name: Auto Translate

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**/*.md'

concurrency:
  group: translation-queue
  cancel-in-progress: false

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main  # 🌟 核心修复 1：强制检出最新的 main 分支，绝不基于过时的历史节点运行！
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run translation script
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python translate.py

      # 🌟 核心修复 2：提交前再次合并云端最新的修改
      - name: Rebase latest changes
        run: |
          git fetch origin main
          git rebase origin/main || true

      - name: Commit and push translated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto translate markdown files via DeepSeek"
          file_pattern: 'docs/**'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'